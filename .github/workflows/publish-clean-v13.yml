name: Publish clean v1.3 source

on:
  push:
    branches: [clean-v1.3]
    paths:
      - '.github/workflows/publish-clean-v13.yml'

permissions:
  contents: write

jobs:
  publish-clean-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clean-v1.3
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Recover the single missing base64 character and verify archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import pathlib

          root = pathlib.Path('_publish_v13')
          chunks = [(root / f'chunk_{i:02d}.b64').read_text().strip() for i in range(13)]
          expected_b64_len = 108752
          expected_raw_len = 81564
          expected_sha = 'fffdba4f71fd95f3ef296ae5c6b59ad07a7d8abd661fc00cdb10f3998c3446f1'
          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'

          for i, chunk in enumerate(chunks):
              expected = 752 if i == 12 else 9000
              if i == 9:
                  expected = 8999
              if len(chunk) != expected:
                  raise SystemExit(f'Unexpected chunk {i:02d} length {len(chunk)} != {expected}')

          bad = chunks[9]
          prefix_b64 = ''.join(chunks[:9])
          suffix_b64 = ''.join(chunks[10:])
          prefix_bytes = base64.b64decode(prefix_b64, validate=True)
          suffix_bytes = base64.b64decode(suffix_b64, validate=True)
          prefix_hash = hashlib.sha256(prefix_bytes)

          recovered = None
          for pos in range(len(bad) + 1):
              left, right = bad[:pos], bad[pos:]
              for ch in alphabet:
                  candidate = left + ch + right
                  try:
                      candidate_bytes = base64.b64decode(candidate, validate=True)
                  except Exception:
                      continue
                  h = prefix_hash.copy()
                  h.update(candidate_bytes)
                  h.update(suffix_bytes)
                  if h.hexdigest() == expected_sha:
                      recovered = candidate
                      print(f'Recovered chunk_09: inserted {ch!r} at position {pos}')
                      break
              if recovered is not None:
                  break

          if recovered is None:
              raise SystemExit('Could not recover chunk_09 from the expected SHA-256')

          full_b64 = prefix_b64 + recovered + suffix_b64
          if len(full_b64) != expected_b64_len:
              raise SystemExit(f'Base64 length {len(full_b64)} != {expected_b64_len}')
          raw = base64.b64decode(full_b64, validate=True)
          if len(raw) != expected_raw_len:
              raise SystemExit(f'Archive length {len(raw)} != {expected_raw_len}')
          digest = hashlib.sha256(raw).hexdigest()
          if digest != expected_sha:
              raise SystemExit(f'SHA mismatch: {digest}')
          pathlib.Path('/tmp/payment_fraud_clean_v13.tar.xz').write_bytes(raw)
          print(f'Archive verified: {len(raw)} bytes, sha256={digest}')
          PY
          tar -tJf /tmp/payment_fraud_clean_v13.tar.xz > /tmp/archive-files.txt
          test -s /tmp/archive-files.txt

      - name: Replace transport tree with normal repository files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/payment_fraud_clean_v13
          mkdir -p /tmp/payment_fraud_clean_v13
          tar -xJf /tmp/payment_fraud_clean_v13.tar.xz -C /tmp/payment_fraud_clean_v13
          test "$(find /tmp/payment_fraud_clean_v13 -type f | wc -l)" -eq 107
          test -f /tmp/payment_fraud_clean_v13/README.md
          test -f /tmp/payment_fraud_clean_v13/src/fraud_decisioning/paysim_full.py
          test -f /tmp/payment_fraud_clean_v13/TAKE_HOME_WALKTHROUGH.md
          test ! -e /tmp/payment_fraud_clean_v13/_bootstrap
          test ! -e /tmp/payment_fraud_clean_v13/_bootstrap_xz
          test ! -e /tmp/payment_fraud_clean_v13/_publish_v13
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/payment_fraud_clean_v13/. .

      - name: Install and run tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest -q

      - name: Commit clean source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'feat: publish clean v1.3 fraud decisioning source tree'
          git push origin HEAD:clean-v1.3
