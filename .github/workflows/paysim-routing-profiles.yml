name: Full PaySim routing profiles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paysim-routing-profiles.yml'
      - 'scripts/run_paysim_routing_profiles.py'
      - 'src/fraud_decisioning/paysim_routing_profiles.py'
      - 'src/fraud_decisioning/paysim_monitoring.py'
      - 'src/fraud_decisioning/paysim_full.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/paysim-routing-profiles.yml'
      - 'scripts/run_paysim_routing_profiles.py'
      - 'src/fraud_decisioning/paysim_routing_profiles.py'
      - 'src/fraud_decisioning/paysim_monitoring.py'
      - 'src/fraud_decisioning/paysim_full.py'

permissions:
  contents: write

jobs:
  paysim-routing-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download canonical PaySim parquet shards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/raw/paysim
          curl --fail --location --retry 5 --retry-all-errors -o data/raw/paysim/0.parquet 'https://huggingface.co/api/datasets/kohdified/synthetic-financial-data/parquet/default/train/0.parquet'
          curl --fail --location --retry 5 --retry-all-errors -o data/raw/paysim/1.parquet 'https://huggingface.co/api/datasets/kohdified/synthetic-financial-data/parquet/default/train/1.parquet'
      - name: Run routing profile audit
        run: |
          python scripts/run_paysim_routing_profiles.py --parquet-glob 'data/raw/paysim/*.parquet' --out results/paysim_routing_profiles
      - name: Show routing profile results
        run: |
          cat results/paysim_routing_profiles/summary.json
          cat results/paysim_routing_profiles/validation_alpha_grid_50_per_10k.csv
          cat results/paysim_routing_profiles/selected_routing_profiles.csv
          cat results/paysim_routing_profiles/future_profile_frontier.csv
          cat results/paysim_routing_profiles/future_profile_windows_50_per_10k.csv
      - uses: actions/upload-artifact@v4
        with:
          name: paysim-routing-profile-results
          path: results/paysim_routing_profiles
          if-no-files-found: error
          retention-days: 30
      - name: Commit aggregate routing profile results
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- results/paysim_routing_profiles
          if git diff --cached --quiet; then
            echo 'No aggregate routing result changes to commit.'
            exit 0
          fi
          git commit -m 'data: add full PaySim routing profile results'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            echo "Publish attempt ${attempt} lost a race; retrying."
            sleep $((attempt * 2))
          done
          exit 1
