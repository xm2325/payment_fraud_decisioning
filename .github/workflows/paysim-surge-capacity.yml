name: Full PaySim surge capacity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paysim-surge-capacity.yml'
      - 'scripts/run_paysim_surge_capacity.py'
      - 'src/fraud_decisioning/paysim_surge_capacity.py'
      - 'src/fraud_decisioning/paysim_routing_profiles.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/paysim-surge-capacity.yml'
      - 'scripts/run_paysim_surge_capacity.py'
      - 'src/fraud_decisioning/paysim_surge_capacity.py'
      - 'src/fraud_decisioning/paysim_routing_profiles.py'

permissions:
  contents: write

jobs:
  paysim-surge-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download canonical PaySim parquet shards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/raw/paysim
          curl --fail --location --retry 5 --retry-all-errors -o data/raw/paysim/0.parquet 'https://huggingface.co/api/datasets/kohdified/synthetic-financial-data/parquet/default/train/0.parquet'
          curl --fail --location --retry 5 --retry-all-errors -o data/raw/paysim/1.parquet 'https://huggingface.co/api/datasets/kohdified/synthetic-financial-data/parquet/default/train/1.parquet'
      - name: Run surge-capacity audit
        run: python scripts/run_paysim_surge_capacity.py --parquet-glob 'data/raw/paysim/*.parquet' --out results/paysim_surge_capacity
      - name: Show aggregate surge results
        run: |
          cat results/paysim_surge_capacity/surge_summary.json
          cat results/paysim_surge_capacity/surge_capacity_windows.csv
          cat results/paysim_surge_capacity/surge_trigger_sensitivity.csv
      - uses: actions/upload-artifact@v4
        with:
          name: paysim-surge-capacity-results
          path: results/paysim_surge_capacity
          if-no-files-found: error
          retention-days: 30
      - name: Commit aggregate surge results
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- results/paysim_surge_capacity
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: add full PaySim surge-capacity results'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
