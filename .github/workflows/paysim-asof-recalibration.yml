name: Full PaySim as-of recalibration

on:
  workflow_dispatch:
  push:
    branches: [main, v1.8-asof-recalibration]
    paths:
      - '.github/workflows/paysim-asof-recalibration.yml'
      - 'scripts/run_paysim_asof_recalibration.py'
      - 'src/fraud_decisioning/paysim_asof_recalibration.py'
      - 'src/fraud_decisioning/paysim_stage_separation.py'
      - 'src/fraud_decisioning/paysim_routing_profiles.py'
      - 'src/fraud_decisioning/paysim_full.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/paysim-asof-recalibration.yml'
      - 'scripts/run_paysim_asof_recalibration.py'
      - 'src/fraud_decisioning/paysim_asof_recalibration.py'
      - 'src/fraud_decisioning/paysim_stage_separation.py'
      - 'src/fraud_decisioning/paysim_routing_profiles.py'
      - 'src/fraud_decisioning/paysim_full.py'

permissions:
  contents: write

jobs:
  paysim-asof-recalibration:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Restore canonical PaySim cache
        id: paysim-cache
        uses: actions/cache@v4
        with:
          path: data/raw/paysim
          key: paysim-parquet-canonical-6362620-8213-step1-743-v1
      - name: Download canonical PaySim parquet shards
        if: steps.paysim-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/raw/paysim
          download() {
            local out="$1"
            local url="$2"
            curl --fail --location \
              --connect-timeout 30 --max-time 600 \
              --speed-limit 32768 --speed-time 60 \
              --retry 8 --retry-delay 2 --retry-all-errors \
              -o "$out" "$url"
          }
          download data/raw/paysim/0.parquet 'https://huggingface.co/api/datasets/kohdified/synthetic-financial-data/parquet/default/train/0.parquet' &
          pid0=$!
          download data/raw/paysim/1.parquet 'https://huggingface.co/api/datasets/kohdified/synthetic-financial-data/parquet/default/train/1.parquet' &
          pid1=$!
          wait "$pid0"
          wait "$pid1"
          test -s data/raw/paysim/0.parquet
          test -s data/raw/paysim/1.parquet
      - name: Run as-of recalibration audit
        run: |
          python scripts/run_paysim_asof_recalibration.py --parquet-glob 'data/raw/paysim/*.parquet' --out results/paysim_asof_recalibration
      - name: Show aggregate recalibration results
        run: |
          cat results/paysim_asof_recalibration/summary.json
          cat results/paysim_asof_recalibration/future_window_recalibration.csv
          cat results/paysim_asof_recalibration/recalibration_method_summary.csv
          cat results/paysim_asof_recalibration/recalibration_vs_frozen.csv
      - uses: actions/upload-artifact@v4
        with:
          name: paysim-asof-recalibration-results
          path: results/paysim_asof_recalibration
          if-no-files-found: error
          retention-days: 30
      - name: Commit aggregate recalibration results
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- results/paysim_asof_recalibration
          if git diff --cached --quiet; then
            echo 'No aggregate recalibration result changes to commit.'
            exit 0
          fi
          git commit -m 'data: add full PaySim as-of recalibration results'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
