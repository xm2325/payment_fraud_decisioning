name: Full PaySim nested validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/paysim-nested-validation.yml'
      - 'scripts/run_paysim_nested_validation.py'
      - 'src/fraud_decisioning/paysim_nested_validation.py'
      - 'src/fraud_decisioning/paysim_routing_robustness.py'
      - 'src/fraud_decisioning/paysim_routing_profiles.py'
      - 'src/fraud_decisioning/paysim_full.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/paysim-nested-validation.yml'
      - 'scripts/run_paysim_nested_validation.py'
      - 'src/fraud_decisioning/paysim_nested_validation.py'
      - 'src/fraud_decisioning/paysim_routing_robustness.py'
      - 'src/fraud_decisioning/paysim_routing_profiles.py'
      - 'src/fraud_decisioning/paysim_full.py'

permissions:
  contents: write

jobs:
  paysim-nested-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download canonical PaySim parquet shards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/raw/paysim
          curl --fail --location --retry 5 --retry-all-errors -o data/raw/paysim/0.parquet 'https://huggingface.co/api/datasets/kohdified/synthetic-financial-data/parquet/default/train/0.parquet'
          curl --fail --location --retry 5 --retry-all-errors -o data/raw/paysim/1.parquet 'https://huggingface.co/api/datasets/kohdified/synthetic-financial-data/parquet/default/train/1.parquet'
      - name: Run nested calibration-policy audit
        run: |
          python scripts/run_paysim_nested_validation.py --parquet-glob 'data/raw/paysim/*.parquet' --out results/paysim_nested_validation
      - name: Show nested-validation results
        run: |
          cat results/paysim_nested_validation/summary.json
          cat results/paysim_nested_validation/calibration_diagnostics.csv
          cat results/paysim_nested_validation/nested_policy_robustness_summary.csv
          cat results/paysim_nested_validation/nested_selected_profiles.csv
          cat results/paysim_nested_validation/future_contract_comparison.csv
          cat results/paysim_nested_validation/future_contract_windows_50_per_10k.csv
      - uses: actions/upload-artifact@v4
        with:
          name: paysim-nested-validation-results
          path: results/paysim_nested_validation
          if-no-files-found: error
          retention-days: 30
      - name: Commit aggregate nested-validation results
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- results/paysim_nested_validation
          if git diff --cached --quiet; then
            echo 'No aggregate nested-validation result changes to commit.'
            exit 0
          fi
          git commit -m 'data: add full PaySim nested validation results'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            echo "Publish attempt ${attempt} lost a race; retrying."
            sleep $((attempt * 2))
          done
          exit 1
