name: Recover full source tree

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-source.yml'
      - '_bootstrap_xz/READY'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/recover-source.yml'
      - '_bootstrap_xz/READY'

permissions:
  contents: write

jobs:
  recover-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Preserve latest PaySim validation files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin paysim-full-validation:paysim-full-validation
          mkdir -p /tmp/v12/src/fraud_decisioning /tmp/v12/scripts /tmp/v12/.github/workflows
          for p in \
            src/fraud_decisioning/paysim_features.py \
            src/fraud_decisioning/paysim_full.py \
            src/fraud_decisioning/paysim_metrics.py \
            scripts/run_paysim_full.py \
            .github/workflows/paysim-full.yml \
            requirements.txt; do
            mkdir -p "/tmp/v12/$(dirname "$p")"
            git show "paysim-full-validation:$p" > "/tmp/v12/$p"
          done

      - name: Reassemble and validate archived full source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            _bootstrap_xz/chunk_00.b64 \
            _bootstrap_xz/chunk_01.b64 \
            _bootstrap_xz/chunk_02.b64 \
            _bootstrap_xz/chunk_03.b64 \
            _bootstrap_xz/chunk_04.b64 \
            _bootstrap_xz/chunk_05part_0.b64 \
            _bootstrap_xz/chunk_05part_1.b64 \
            _bootstrap_xz/chunk_06.b64 > /tmp/source.b64
          test "$(wc -c < /tmp/source.b64)" -eq 57132
          base64 --decode /tmp/source.b64 > /tmp/source.tar.xz
          tar -tJf /tmp/source.tar.xz > /tmp/source-files.txt
          test -s /tmp/source-files.txt
          tar -xJf /tmp/source.tar.xz -C .

      - name: Restore current PaySim overlay and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/v12/. .
          rm -rf _bootstrap _bootstrap_xz _bootstrap_v11
          rm -f .github/workflows/bootstrap.yml .github/workflows/source-bootstrap.yml .github/workflows/recover-source.yml
          git rm -r --cached --ignore-unmatch _bootstrap _bootstrap_xz _bootstrap_v11 \
            .github/workflows/bootstrap.yml .github/workflows/source-bootstrap.yml .github/workflows/recover-source.yml
          git add -- .
          git status --short

      - name: Commit recovered normal tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          TARGET="${GITHUB_HEAD_REF:-main}"
          git commit -m 'feat: publish full fraud decisioning source tree'
          git push origin "HEAD:${TARGET}"
