name: Full PaySim cap profile stability

on:
  workflow_dispatch:
  push:
    branches: [main, v1.17-cap-profile-stability]
    paths:
      - '.github/workflows/paysim-cap-profile-stability.yml'
      - 'scripts/run_paysim_cap_profile_stability.py'
      - 'src/fraud_decisioning/paysim_cap_profile_stability.py'
      - 'src/fraud_decisioning/paysim_cap_stability.py'
      - 'src/fraud_decisioning/paysim_backlog_cap.py'
      - 'src/fraud_decisioning/paysim_backlog_handoff.py'
      - 'src/fraud_decisioning/paysim_features.py'
      - 'src/fraud_decisioning/paysim_full.py'
      - 'src/fraud_decisioning/paysim_rolling_refresh.py'
      - 'src/fraud_decisioning/paysim_routing_profiles.py'
      - 'src/fraud_decisioning/paysim_routing_robustness.py'
      - 'src/fraud_decisioning/paysim_stage_separation.py'
      - 'src/fraud_decisioning/modeling.py'
      - 'results/paysim_cap_stability/capacity_pathwise_stability.csv'
      - 'results/paysim_cap_stability/capacity_queue_metrics.csv'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/paysim-cap-profile-stability.yml'
      - 'scripts/run_paysim_cap_profile_stability.py'
      - 'src/fraud_decisioning/paysim_cap_profile_stability.py'
      - 'src/fraud_decisioning/paysim_cap_stability.py'
      - 'src/fraud_decisioning/paysim_backlog_cap.py'
      - 'src/fraud_decisioning/paysim_backlog_handoff.py'
      - 'src/fraud_decisioning/paysim_features.py'
      - 'src/fraud_decisioning/paysim_full.py'
      - 'src/fraud_decisioning/paysim_rolling_refresh.py'
      - 'src/fraud_decisioning/paysim_routing_profiles.py'
      - 'src/fraud_decisioning/paysim_routing_robustness.py'
      - 'src/fraud_decisioning/paysim_stage_separation.py'
      - 'src/fraud_decisioning/modeling.py'
      - 'results/paysim_cap_stability/capacity_pathwise_stability.csv'
      - 'results/paysim_cap_stability/capacity_queue_metrics.csv'

permissions:
  contents: write

jobs:
  paysim-cap-profile-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download canonical PaySim parquet shards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/raw/paysim
          curl --fail --location --retry 5 --retry-all-errors -o data/raw/paysim/0.parquet 'https://huggingface.co/api/datasets/kohdified/synthetic-financial-data/parquet/default/train/0.parquet'
          curl --fail --location --retry 5 --retry-all-errors -o data/raw/paysim/1.parquet 'https://huggingface.co/api/datasets/kohdified/synthetic-financial-data/parquet/default/train/1.parquet'
      - name: Run cap profile stability audit
        run: |
          python scripts/run_paysim_cap_profile_stability.py \
            --parquet-glob 'data/raw/paysim/*.parquet' \
            --v16-pathwise-reference results/paysim_cap_stability/capacity_pathwise_stability.csv \
            --v16-metrics-reference results/paysim_cap_stability/capacity_queue_metrics.csv \
            --out results/paysim_cap_profile_stability
      - name: Show profile stability results
        run: |
          cat results/paysim_cap_profile_stability/summary.json
          cat results/paysim_cap_profile_stability/profile_stability_summary.csv
          cat results/paysim_cap_profile_stability/profile_capacity_pathwise_stability.csv
      - uses: actions/upload-artifact@v4
        with:
          name: paysim-cap-profile-stability-results
          path: results/paysim_cap_profile_stability
          if-no-files-found: error
          retention-days: 30
      - name: Commit aggregate profile-stability results
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- results/paysim_cap_profile_stability
          if git diff --cached --quiet; then
            echo 'No aggregate profile-stability result changes to commit.'
            exit 0
          fi
          git commit -m 'data: add PaySim cap profile stability results'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            echo "Publish attempt ${attempt} lost a race; retrying."
            sleep $((attempt * 2))
          done
          exit 1
